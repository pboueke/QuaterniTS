# QuaterniTS continuous integration.
#
# The workflow is the backstop to the local gate, not a substitute: it checks
# out a fresh tree, installs only the rootless Podman host prerequisite, and
# runs the same `make verify` target a developer runs, so every tool command
# stays inside the digest-pinned toolkit image. No Node or npm runs on the
# runner.
#
# `make verify` now includes the real browser consumer leg, so a fresh runner
# builds `quaternits-browser:local` first, which pulls the ~2.8 GB
# digest-pinned Playwright base image once (toolkit/Containerfile.browser).
# That pull is the reason this job is slower than the unit-test-only part of
# the gate; it is a real check, not a cache, and it is deliberately not
# skipped or stubbed.
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least privilege: the gate only reads the repository.
permissions:
  contents: read

# Keep standalone CI and a reusable CI call in separate groups: otherwise
# their simultaneous main-push runs would cancel each other before tagging.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify (pinned rootless Podman toolkit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the rootless Podman host prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            podman uidmap slirp4netns netavark aardvark-dns
          # Rootless Podman needs subordinate id ranges for the runner user.
          runner="$(id -un)"
          grep -q "^${runner}:" /etc/subuid ||
            sudo usermod --add-subuids 100000-165535 "${runner}"
          grep -q "^${runner}:" /etc/subgid ||
            sudo usermod --add-subgids 100000-165535 "${runner}"

      - name: Preflight rootless Podman
        run: make preflight

      - name: Run the toolkit gate on the fresh checkout
        run: make verify
