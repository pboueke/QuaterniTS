# Tag the current release version once when a commit reaches main.
# This workflow does not publish to npm or replace an existing tag.
name: Tag release version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-tag-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag current version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Create the version tag if absent
        shell: bash
        run: |
          set -euo pipefail
          IFS= read -r heading < CHANGELOG.md
          release_heading='^##[[:space:]]'
          release_heading+='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          release_heading+='([-+][0-9A-Za-z.+-]+)?$'
          if [[ ! "$heading" =~ $release_heading ]]; then
            echo 'Invalid top CHANGELOG.md version heading' >&2
            exit 1
          fi
          version="${heading#\#\# }"
          expected="  \"version\": \"$version\","
          matches=0
          private_true='^[[:space:]]*"private"[[:space:]]*:[[:space:]]*true'
          while IFS= read -r line; do
            if [[ "$line" == "$expected" ]]; then
              matches=$((matches + 1))
            fi
            if [[ "$line" =~ $private_true ]]; then
              echo 'Private package: no release tag'
              exit 0
            fi
          done < package.json
          if (( matches != 1 )); then
            echo 'package.json version does not match CHANGELOG.md' >&2
            exit 1
          fi

          tag="v$version"
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'main advanced since this push; skipping stale tag'
            exit 0
          fi
          if [[ -n "$(git ls-remote origin "refs/tags/$tag")" ]]; then
            echo "$tag already exists; not moving it"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
